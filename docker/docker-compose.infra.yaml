# Shared infrastructure services.
#
# Not meant to be run directly: both docker-compose.local.yaml (host development)
# and docker-compose.yaml (full containerized stack) pull this in via `include`,
# so the definitions can never drift between the two.

services:

  ristops-postgres:
    container_name: ristops-postgres
    image: postgres:17-alpine
    restart: always
    hostname: postgres
    ports:
      - 5432:5432
    volumes:
      - /$HOME/.ristops/postgres/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${RISTOPS_PG_PWD:-ristops}
      - POSTGRES_USER=${RISTOPS_PG_USER:-ristops}
      - POSTGRES_DB=${RISTOPS_PG_DB_NAME:-ristops}
    networks:
      - ristops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RISTOPS_PG_USER:-ristops} -d ${RISTOPS_PG_DB_NAME:-ristops}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis-session:
    container_name: ristops-redis-session
    image: redis:7.2-alpine
    restart: unless-stopped
    hostname: redis-session
    ports:
      - 6379:6379
    command: sh -c "apk add --no-cache gettext && envsubst < /usr/local/etc/redis/redis.conf.template > /usr/local/etc/redis/redis.conf && redis-server /usr/local/etc/redis/redis.conf"
    volumes:
      - ./redis/redis-session.conf.template:/usr/local/etc/redis/redis.conf.template:ro
      - /$HOME/.ristops/redis/session/data:/data
    networks:
      - ristops
    healthcheck:
      # $$ escapes compose interpolation so the password is read inside the container
      test: ["CMD-SHELL", "redis-cli -p 6379 -a \"$$RISTOPS_REDIS_SESSION_PWD\" PING"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      RISTOPS_REDIS_SESSION_PWD: ${RISTOPS_REDIS_SESSION_PWD:-ristops}

  redis-stream:
    container_name: ristops-redis-stream
    image: redis:7.2-alpine
    restart: unless-stopped
    hostname: redis-stream
    ports:
      - 6380:6380
    command: sh -c "apk add --no-cache gettext && envsubst < /usr/local/etc/redis/redis.conf.template > /usr/local/etc/redis/redis.conf && redis-server /usr/local/etc/redis/redis.conf"
    volumes:
      - ./redis/redis-stream.conf.template:/usr/local/etc/redis/redis.conf.template:ro
      - /$HOME/.ristops/redis/stream/data:/data
    networks:
      - ristops
    healthcheck:
      # this server listens on 6380, so -p is required: redis-cli would otherwise probe 6379
      test: ["CMD-SHELL", "redis-cli -p 6380 -a \"$$RISTOPS_REDIS_STREAM_PWD\" PING"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      RISTOPS_REDIS_STREAM_PWD: ${RISTOPS_REDIS_STREAM_PWD:-ristops}

  neo4j:
    container_name: ristops-neo4j
    image: neo4j:latest
    restart: unless-stopped
    hostname: neo4j
    ports:
      - "7474:7474"  # browser UI
      - "7687:7687"  # bolt protocol
    environment:
      NEO4J_AUTH: neo4j/${RISTOPS_NEO4J_PWD:-ristops1}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - /$HOME/.ristops/neo4j/data:/data
      - /$HOME/.ristops/neo4j/logs:/logs
    networks:
      - ristops
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${RISTOPS_NEO4J_PWD:-ristops1}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ristops:
    name: ristops
    driver: bridge
