# Development stack: infrastructure, plus one-shot schema creation.
#
# Backend services and the frontend run on the host (`ristops start <app>`,
# `npm run dev`) against these containers. No long-running application images, no
# nginx and no observability stack — for those use docker-compose.yaml.
#
# init-db is the one exception: it runs to completion and exits, so a fresh
# Postgres volume has its schemas without a manual step.
#
#   docker compose -f docker/docker-compose.local.yaml up

name: ristops

include:
  - docker-compose.infra.yaml
  - docker-compose.init.yaml
