[project]
name = "ristops-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ristops-bff-web",
    "ristops-be-authn",
    "ristops-be-authz",
    "ristops-be-venue",
    "ristops-be-reservation",
    "ristops-be-chat",
    "ristops-batch-demo",
    "ristops-lib-core",
    "ristops-lib-be",
    "ristops-lib-sql",
    "ristops-lib-redis",
    "ristops-lib-neo4j",
    "ristops-lib-otel",
    "ristops-lib-agent",
]

[tool.uv.sources]
ristops-bff-web = { workspace = true }
ristops-be-authn = { workspace = true }
ristops-be-authz = { workspace = true }
ristops-be-venue = { workspace = true }
ristops-be-reservation = { workspace = true }
ristops-be-chat = { workspace = true }
ristops-batch-demo = { workspace = true }
ristops-lib-core = { workspace = true }
ristops-lib-be = { workspace = true }
ristops-lib-sql = { workspace = true }
ristops-lib-redis = { workspace = true }
ristops-lib-neo4j = { workspace = true }
ristops-lib-otel = { workspace = true }
ristops-lib-agent = { workspace = true }


[tool.uv.workspace]
members = ["packages/*"]
exclude = []

[dependency-groups]
dev = [
    "pytest>=9.1",
]

[tool.pytest.ini_options]
testpaths = ["packages/ristops-lib-core/tests"]
