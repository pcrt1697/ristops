[project]
name = "ristops-be-authz"
version = "0.1.0"
dependencies = [
    "fastapi",
    "ristops-lib-neo4j",
    "ristops-lib-core",
    "ristops-lib-otel",
    "ristops-lib-be",
    "ristops-lib-redis",
]

[tool.uv.build-backend]
source-include = ["database/migrations/**"]

[project.scripts]
ristops = "ristops_lib_core.cli.entrypoint:main"

[project.entry-points."ristops.cli.commands"]
start = "ristops_lib_core.cli.start:start"
openapi = "ristops_lib_core.cli.openapi:openapi"
seed-authz = "ristops_be_authz.cli.seed:seed"
nuke-authz = "ristops_be_authz.cli.nuke:nuke"

[project.entry-points."ristops.cli.commands.start"]
be-authz = "ristops_be_authz.app:create_app"

[project.entry-points."ristops.cli.commands.openapi.export"]
be-authz = "ristops_be_authz.app:build_api"
