  revokeAccess(
    """Access revoke request."""
    input: RevokeAccessInput!
  ): Boolean!

  """Create a new venue."""
  createVenue(
    """Venue information."""
    input: CreateVenueInput!
  ): Venue!

  """Update venue data"""
  updateVenue(
    """Entity identifier."""
    id: ID!

    """Venue information to update."""
    input: UpdateVenueInput!
  ): Venue!

  """Activate a venue: owner action, valid from PENDING or CLOSED."""
  activateVenue(
    """Entity identifier."""
    id: ID!
  ): Venue!

  """
  Close a venue: owner action, valid only from ACTIVE. Soft — no data is lost.
  """
  closeVenue(
    """Entity identifier."""
    id: ID!
  ): Venue!

  """Disable a venue: app-admin action, valid from PENDING or ACTIVE."""
  disableVenue(
    """Entity identifier."""
    id: ID!
  ): Venue!

  """
  Re-enable a venue: app-admin action, valid only from DISABLED. Lands on PENDING — the owner must still activate it, which requires at least one service configured.
  """
  enableVenue(
    """Entity identifier."""
    id: ID!
  ): Venue!

  """Create a new service."""
  createService(
    """Service information."""
    input: CreateServiceInput!
  ): Service!

  """Update a service."""
  updateService(
    """Entity identifier."""
    id: ID!

    """Service information to update."""
    input: UpdateServiceInput!
  ): Service!

  """Delete a service."""
  deleteService(
    """Entity identifier."""
    id: ID!
  ): Boolean!

  """Replace a service's weekly opening hours."""
  upsertServiceOpenings(
    """Service ID."""
    serviceId: ID!

    """The service's complete weekly hours."""
    input: [OpeningUpsertInput!]!
  ): [Opening!]!

  """Close one or more of a venue's services over a date range."""
  createClosing(
    """Entity identifier."""
    id: ID!

    """Closing information."""
    input: ClosingCreateInput!
  ): Closing!

  """Update a closing."""
  updateClosing(
    """Entity identifier."""
    id: ID!

    """Closing ID."""
    closingId: ID!

    """Closing fields to update."""
    input: ClosingUpdateInput!
  ): Closing!

  """Delete a closing."""
  deleteClosing(
    """Entity identifier."""
    id: ID!

    """Closing ID."""
    closingId: ID!
  ): Boolean!

  """Create a reservation."""
  createReservation(
    """Reservation information."""
    input: CreateReservationInput!
  ): Reservation!

  """Update a reservation's editable fields."""
  updateReservation(
    """Entity identifier."""
    id: ID!

    """Reservation fields to update."""
    input: UpdateReservationInput!
  ): Reservation!

  """Confirm (accept) a reservation."""
  confirmReservation(
    """Entity identifier."""
    id: ID!
    notes: String = null
  ): Reservation!

  """Reject (decline) a pending reservation."""
  rejectReservation(
    """Entity identifier."""
    id: ID!
    notes: String = null
  ): Reservation!

  """Cancel a reservation (customer-initiated)."""
  cancelReservation(
    """Entity identifier."""
    id: ID!
    notes: String = null
  ): Reservation!

  """Check a reservation in (records arrival)."""
  checkInReservation(
    """Entity identifier."""
    id: ID!

    """Venue-local arrival time; defaults to now if omitted."""
    arrivalTime: Time = null
    notes: String = null
  ): Reservation!

  """Mark a reservation as a no-show."""
  noShowReservation(
    """Entity identifier."""
    id: ID!
    notes: String = null
  ): Reservation!

  """Withdraw a booking the venue can no longer honor (venue-initiated)."""
  withdrawReservation(
    """Entity identifier."""
    id: ID!
