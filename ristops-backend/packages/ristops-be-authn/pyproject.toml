[project]
name = "ristops-be-authn"
version = "0.1.0"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=46.0.7",
]

[project.scripts]
ristops = "ristops_lib_core.cli.entrypoint:main"

[project.entry-points."ristops.cli.commands"]
start = "ristops_lib_core.cli.start:start"
sql-database = "ristops_lib_sql.cli:sql_database"
seed-authn = "ristops_be_authn.cli.seed:seed"

[project.entry-points."ristops.cli.commands.start"]
be-authn = "ristops_be_authn.app:create_app"

[project.entry-points."ristops.cli.commands.sql_database.generate_ddl"]
be-authn = "ristops_be_authn.domain:MODELS"
