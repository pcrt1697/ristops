repos:
  - repo: local
    hooks:
      - id: export-api-schemas
        name: Export OpenAPI and GraphQL schemas
        entry: scripts/export-api-schemas.sh
        # runs the entry as a plain command on this machine (named `system` before pre-commit 4.4)
        language: unsupported
        # the script regenerates every schema, so it takes no file list
        pass_filenames: false
        # backend code and package metadata, plus the generated schemas so a hand edit is overwritten
        files: ^(ristops-backend/packages/[^/]+/(src/.*\.py|pyproject\.toml|openapi\.json)|ristops-web/graphql/schema\.gql)$
