server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # hashed build assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # the SPA owns its routes: never 404 a client-side path
    location / {
        try_files $uri $uri/ /index.html;
    }
}
