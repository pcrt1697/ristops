type UserProfileModel {
  id: ID!
  email: String!
  username: String!
  displayName: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type UserModel {
  id: ID!
  username: String!
  displayName: String!
}

type Query {
  getUser(id: String!): UserModel!
  getMe: UserProfileModel!
}

type Mutation {
  updateMe(username: String, displayName: String, email: String, password: String): UserProfileModel!
}