"""Authorization resource definition."""
type AuthorizationResource {
  resourceId: String!
  resourceType: ResourceType!
}

"""Date with time (isoformat)"""
scalar DateTime

"""User information to update."""
input ListRolesInput {
  resourceId: String!
  resourceType: ResourceType!
}

type Mutation {
  """Update user data by ID"""
  updateUser(
    """Entity identifier."""
    id: ID!

    """User information to update."""
    input: UpdateUserInput!
  ): User!

  """Update current user data"""
  updateMe(
    """User information to update."""
    input: UpdateUserInput!
  ): User!
}

type Query {
  """Fetch user by ID"""
  user(
    """Entity identifier."""
    id: ID!
  ): User!

  """Fetch authenticated user"""
  me: User!

  """Fetch role by ID"""
  role(
    """Entity identifier."""
    id: ID!
  ): Role!

  """Fetch roles assigned to the authenticated user on a resource"""
  myRoles(
    """User information to update."""
    input: ListRolesInput!
  ): UserRoleGrants!
}

enum ResourceType {
  APP
  VENUE
  PERMISSION
  ROLE
  ACL
  USER
}

"""Role entity information."""
type Role {
  id: String!
  name: String!
  description: String!
  permissions: [String!]!
}

"""User information to update."""
input UpdateUserInput {
  username: String = null
  displayName: String = null
  email: String = null
  password: String = null
}

"""User entity information."""
type User {
  id: String!
  username: String!
  displayName: String
  email: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Resource the user has access to, given a specific set of permissions."""
type UserRoleGrant {
  resource: AuthorizationResource!
  role: Role!
}

"""Resources the user has access to, given a specific set of permissions."""
type UserRoleGrants {
  grants: [UserRoleGrant!]!
}