fragment ServiceFields on Service {
    id
    name
    description
    dateFrom
    dateTo
    capacity
    deletedAt
    createdAt
    updatedAt
}

query GetService($id: ID!) {
    service(id: $id) {
        ...ServiceFields
        venue {
            id
            name
            address
            description
            status
            createdAt
            updatedAt
        }
    }
}

query ListServices($venueId: ID!, $name: String, $includeDeleted: Boolean) {
    listServices(venueId: $venueId, name: $name, includeDeleted: $includeDeleted) {
        ...ServiceFields
    }
}

mutation CreateService($input: CreateServiceInput!) {
    createService(input: $input) {
        ...ServiceFields
    }
}

mutation UpdateService($id: ID!, $input: UpdateServiceInput!) {
    updateService(id: $id, input: $input) {
        ...ServiceFields
    }
}

mutation DeleteService($id: ID!) {
    deleteService(id: $id)
}
