query ListServiceOpenings($serviceId: ID!, $includeDeleted: Boolean) {
    serviceOpenings(id: $serviceId, includeDeleted: $includeDeleted) {
        id
        serviceId
        weekday
        capacity
        startTime
        endTime
        description
        createdAt
        updatedAt
    }
}

mutation UpsertServiceOpenings($serviceId: ID!, $openings: [OpeningUpsertInput!]!) {
    upsertServiceOpenings(id: $serviceId, openings: $openings) {
        id
        serviceId
        weekday
        capacity
        startTime
        endTime
        description
        createdAt
        updatedAt
    }
}

query SearchOpeningOverrides($serviceId: ID!, $input: OpeningOverrideSearchInput) {
    serviceOpeningOverrides(id: $serviceId, input: $input) {
        items {
            id
            serviceId
            dateStart
            dateEnd
            weekday
            capacity
            startTime
            endTime
            description
            createdAt
            updatedAt
        }
        total
        page
        pageSize
        totalPages
    }
}

mutation CreateOpeningOverride($serviceId: ID!, $input: OpeningOverrideCreateInput!) {
    createOpeningOverride(id: $serviceId, input: $input) {
        id
    }
}

mutation UpdateOpeningOverride($serviceId: ID!, $overrideId: ID!, $input: OpeningOverrideUpdateInput!) {
    updateOpeningOverride(id: $serviceId, overrideId: $overrideId, input: $input) {
        id
    }
}

mutation DeleteOpeningOverride($serviceId: ID!, $overrideId: ID!) {
    deleteOpeningOverride(id: $serviceId, overrideId: $overrideId)
}

