query OpeningOverrideConflicts($serviceId: ID!, $input: ConflictCheckInput!) {
    serviceOpeningOverrideConflicts(id: $serviceId, input: $input) {
        weekday
        source
        conflictingId
        conflictingDateStart
        conflictingDateEnd
        conflictingWeekday
    }
}

