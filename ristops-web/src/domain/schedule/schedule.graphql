fragment OpeningFields on Opening {
    id
    serviceId
    weekday
    startTime
    endTime
    description
}

fragment ClosingFields on Closing {
    id
    venueId
    dateFrom
    dateTo
    serviceIds
    description
    createdAt
    updatedAt
}

query ListServiceOpenings($serviceId: ID!) {
    serviceOpenings(serviceId: $serviceId) {
        ...OpeningFields
    }
}

mutation UpsertServiceOpenings($serviceId: ID!, $input: [OpeningUpsertInput!]!) {
    upsertServiceOpenings(serviceId: $serviceId, input: $input) {
        ...OpeningFields
    }
}

query SearchClosings($id: ID!, $input: ClosingSearchInput) {
    venueClosings(id: $id, input: $input) {
        items {
            ...ClosingFields
        }
        total
        page
        pageSize
        totalPages
    }
}

mutation CreateClosing($id: ID!, $input: ClosingCreateInput!) {
    createClosing(id: $id, input: $input) {
        ...ClosingFields
    }
}

mutation UpdateClosing($id: ID!, $closingId: ID!, $input: ClosingUpdateInput!) {
    updateClosing(id: $id, closingId: $closingId, input: $input) {
        ...ClosingFields
    }
}

mutation DeleteClosing($id: ID!, $closingId: ID!) {
    deleteClosing(id: $id, closingId: $closingId)
}
