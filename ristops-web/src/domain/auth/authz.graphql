query ListMyGrants($input: ListGrantsInput!) {
    myGrants(input: $input) {
        grants {
            resource {
                resourceId
                resourceType
            }
            role {
                id
                name
                description
                permissions
            }
        }
    }
}

query ListRoles($input: ListRolesInput!) {
    listRoles(input: $input) {
        roles {
            id
            name
            description
            permissions
        }
    }
}
